<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <style>
        body
        {
            background-color: bisque;
        }
    </style>
</head>
<body>
    <center>
        <h1>Sum of Numbers</h1>
        <hr/>
        <form method="post">
            <table border="1">
                <tr><td>Enter First Number</td>
                    <td><input type="text" name="num1" required></td></tr>
                <tr><td>Enter Second Number</td>
                    <td><input type="text" name="num2" required></td></tr>
                <tr><td><input type="submit" value="Sum"/></td>
                <td>{{result}}</td></tr>
            </table>
        </form>
    </center>
</body>
</html>
